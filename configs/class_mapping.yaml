# Standardized class mapping from open-source datasets to the 11 competition classes.
# Target IDs:
#   0: Car | 1: Bus | 2: Truck | 3: Other vehicle | 4: Motorcycle | 5: Motorcyclist
#   6: Bicycle | 7: Cyclist | 8: Pedestrian | 9: Sign | 10: Traffic light

target_classes:
  0: Car
  1: Bus
  2: Truck
  3: Other vehicle
  4: Motorcycle
  5: Motorcyclist
  6: Bicycle
  7: Cyclist
  8: Pedestrian
  9: Sign
  10: Traffic light

# Rules for Geometric Mask Merger (converting separate person/rider + 2-wheeler -> single instance)
geometric_merge_rules:
  motorcycle_to_motorcyclist:
    vehicle_class: 4
    merged_class: 5
    auto_merge_min_iou: 0.04
    auto_merge_min_person_overlap: 0.12
    auto_merge_min_bbox_iou: 0.08
    auto_merge_max_dx_ratio: 0.60
    ambiguity_min_person_overlap: 0.03
    max_center_dx_ratio: 0.75
    require_rider_above_or_inside: true
  bicycle_to_cyclist:
    vehicle_class: 6
    merged_class: 7
    auto_merge_min_iou: 0.04
    auto_merge_min_person_overlap: 0.12
    auto_merge_min_bbox_iou: 0.08
    auto_merge_max_dx_ratio: 0.60
    ambiguity_min_person_overlap: 0.03
    max_center_dx_ratio: 0.75
    require_rider_above_or_inside: true

sources:
  mapillary_vistas:
    direct_map:
      "object--vehicle--car": 0
      "object--vehicle--bus": 1
