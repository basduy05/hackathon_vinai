# Standardized class mapping from open-source datasets to the 11 competition classes.
# Target IDs:
#   0: Car | 1: Bus | 2: Truck | 3: Other vehicle | 4: Motorcycle | 5: Motorcyclist
#   6: Bicycle | 7: Cyclist | 8: Pedestrian | 9: Sign | 10: Traffic light

target_classes:
  0: Car
  1: Bus
  2: Truck
  3: Other vehicle
  4: Motorcycle
  5: Motorcyclist
  6: Bicycle
  7: Cyclist
  8: Pedestrian
  9: Sign
  10: Traffic light

# Rules for Geometric Mask Merger (converting separate person/rider + 2-wheeler -> single instance)
geometric_merge_rules:
  motorcycle_to_motorcyclist:
    vehicle_class: 4
    merged_class: 5
    auto_merge_min_iou: 0.08
    auto_merge_min_person_overlap: 0.25
    ambiguity_min_person_overlap: 0.05
    max_center_dx_ratio: 0.75
    require_rider_above_or_inside: true
  bicycle_to_cyclist:
    vehicle_class: 6
    merged_class: 7
    auto_merge_min_iou: 0.08
    auto_merge_min_person_overlap: 0.25
    ambiguity_min_person_overlap: 0.05
    max_center_dx_ratio: 0.75
    require_rider_above_or_inside: true

sources:
  mapillary_vistas:
    direct_map:
      "object--vehicle--car": 0
      "object--vehicle--bus": 1
      "object--vehicle--truck": 2
      "object--vehicle--other-vehicle": 3
      "object--vehicle--caravan": 3
      "object--vehicle--trailer": 3
      "object--vehicle--wheeled-slow": 3
      "object--vehicle--motorcycle": 4
      "object--rider--motorcyclist": 5
      "object--vehicle--bicycle": 6
      "object--rider--bicyclist": 7
      "object--person": 8
      "object--traffic-sign--front": 9
      "object--traffic-sign--back": 9
      "object--traffic-sign--direction-front": 9
      "object--traffic-sign--direction-back": 9
      "object--traffic-sign--ambiguous": 9
      "object--traffic-light": 10
      "object--traffic-light--general-upright": 10
      "object--traffic-light--general-horizontal": 10
      "object--traffic-light--pedestrians": 10
      "object--traffic-light--cyclists": 10
    needs_rider_merge: false

  idd:
    direct_map:
      "car": 0
      "bus": 1
      "truck": 2
      "auto-rickshaw": 3
      "autorickshaw": 3
      "caravan": 3
      "trailer": 3
      "vehicle fallback": 3
      "motorcycle": 4
      "bicycle": 6
      "person": 8
      "rider": 8  # Merged into 5 or 7 when overlapping motorcycle/bicycle; unresolved riders go to ambiguity queue
      "traffic sign": 9
      "traffic light": 10
    needs_rider_merge: true
    rider_labels: ["rider"]

  bdd100k:
    direct_map:
      "car": 0
      "bus": 1
      "truck": 2
      "trailer": 3
      "other vehicle": 3
      "motorcycle": 4
      "bicycle": 6
      "pedestrian": 8
      "person": 8
      "rider": 8  # Merged into 5 or 7 when overlapping motorcycle/bicycle
      "traffic sign": 9
      "traffic light": 10
    needs_rider_merge: true
    rider_labels: ["rider"]

  coco:
    direct_map:
      "car": 0
      "bus": 1
      "truck": 2
      "motorcycle": 4
      "bicycle": 6
      "person": 8  # Merged into 5 or 7 via Geometric Mask Merger when riding
      "stop sign": 9
      "traffic light": 10
    needs_rider_merge: true
    rider_labels: ["person"]

  vnts_vietnam_signs:
    # BBox datasets -> upgraded via box_to_mask_sam2.py
    default_class: 9
    notes: "All traffic sign subcategories map to 9 (Sign); SAM2 box prompt avoids pole."
